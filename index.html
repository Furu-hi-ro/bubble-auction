<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1F3A">
<title>バブル実験市場｜50人版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: one column. Participants (phone) get a compact order ticket near the top; the host (PC / projector) gets a wider page with a big room code and chart. */
/* Theme: a trading-floor board — deep navy with signal yellow for "now", red for buying / rising and
   blue for selling / falling (the Japanese market convention), Universal Design typefaces for legibility
   on phones and on a projector at the back of the room. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#EDF1F6; --fg:#0F1F3A; --muted:#55657C; --line:#D6DEE9; --line-strong:#A9B7C9;
  --accent:#0F1F3A; --on-accent:#FFFFFF; --accent-soft:#FFF4CC; --hi:#FFC928; --board:#0F1F3A; --on-board:#FFFFFF;
  --buy:#C62F3E; --sell:#1E5CC8; --buy-soft:#FCE9EB; --sell-soft:#E7EEFC; --up:#C62F3E; --down:#1E5CC8;
  --good:#0E7A55; --bad:#C62F3E; --good-soft:#E1F3EA; --fv:#6B7A90; --ref:#6B7A90;
  --font-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --font-mono:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1424; --surface:#13203A; --sunk:#0F1A2F; --fg:#E8EEF7; --muted:#9AAAC2; --line:#24344F; --line-strong:#3A4D6E;
  --accent:#FFD24D; --on-accent:#0B1424; --accent-soft:#3A3212; --hi:#FFD24D; --board:#060E1C; --on-board:#F3F6FB;
  --buy:#FF7A86; --sell:#7FA8FF; --buy-soft:#3A1820; --sell-soft:#142748; --up:#FF7A86; --down:#7FA8FF;
  --good:#4FD19A; --bad:#FF7A86; --good-soft:#123527; --fv:#9AAAC2; --ref:#9AAAC2; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.65;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
body.wide .wrap{max-width:1040px}
header.top{display:flex;flex-direction:column;gap:4px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(23px,6vw,32px);line-height:1.15;margin:0;letter-spacing:.02em}
h1 a{color:inherit;text-decoration:none}
h2{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.sub a{color:var(--buy)}
[hidden]{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--good)}
#main{display:flex;flex-direction:column;gap:14px}
#main>section{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.plain{display:flex;flex-direction:column;gap:12px}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12.5px} p{margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.lab{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.val{font-family:var(--font-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
body.wide .val{font-size:28px}
.dev{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--sell)} .down{color:var(--buy)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
label{font-size:12.5px;color:var(--muted);font-weight:500}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px}
.err{color:var(--sell);font-size:13px;font-weight:700}
.err:empty{display:none}
button{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{background:var(--sell);border-color:var(--sell);color:var(--surface)}
button.link{border:none;background:none;padding:4px 0;color:var(--muted);text-decoration:underline;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
button.wide{width:100%;padding:13px 16px;font-size:16px}
/* order ticket */
.tk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.side{border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.side.buy{background:var(--buy-soft)} .side.sell{background:var(--sell-soft)}
.sh{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.side.buy .sh{color:var(--buy)} .side.sell .sh{color:var(--sell)}
.sh span{font-weight:500;font-size:11.5px;color:var(--muted)}
.money{display:flex;align-items:baseline;gap:4px}
.money input{font-family:var(--font-mono);font-size:21px;font-weight:600;padding:7px 8px;font-variant-numeric:tabular-nums}
.money span{color:var(--muted);font-size:13px}
.step{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:4px;align-items:center}
.step button{padding:0;height:38px;font-size:20px;line-height:1}
.step input{text-align:center;font-family:var(--font-mono);font-size:17px;padding:6px 2px;height:38px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4;min-height:2.8em}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--buy-soft);color:var(--buy)}
.pill.me{background:var(--accent-soft);color:var(--accent)}
.mine{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--muted)}
.mine b{font-family:var(--font-mono);font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.hero-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-price .num{font-family:var(--font-display);font-size:clamp(38px,11vw,60px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.hero-price .unit{font-size:16px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
th:first-child,td:first-child,td.name,th.name{text-align:left}
td.mono{font-family:var(--font-mono)}
tr.me td{background:var(--accent-soft)}
@media (max-width:420px){table{font-size:12.5px} th,td{padding:6px 3px} th{font-size:10px;letter-spacing:.02em}}
.seats{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.seats li{font-size:13.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.seats li.done{border-color:var(--buy);color:var(--buy)}
.seats li.bot{color:var(--muted);border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.countdown.low{color:var(--sell)}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}
.rules ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.divs{display:inline-flex;gap:6px;flex-wrap:wrap}
.divs span{font-family:var(--font-mono);border:1px solid var(--line-strong);border-radius:6px;padding:0 7px;font-size:13px}
/* room code + QR */
.lobby{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:720px){.lobby{grid-template-columns:auto 1fr}}
.qr{width:min(260px,70vw);aspect-ratio:1;max-width:100%;background:#fff;border-radius:10px;padding:8px;justify-self:center}
.qr svg{display:block;width:100%;height:100%}
.code{font-family:var(--font-display);font-size:clamp(46px,12vw,92px);line-height:1;letter-spacing:.12em;color:var(--accent)}
.url{font-family:var(--font-mono);font-size:13px;word-break:break-all;color:var(--muted)}
.codein{font-family:var(--font-mono);font-size:26px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.choices{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash .9s ease-out}@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}}

.seats li .mg{display:inline-flex;gap:4px;margin-left:4px}
button.mini{min-height:0;padding:2px 8px;font-size:12px;border-radius:999px;line-height:1.5}
#mgmt summary{cursor:pointer;font-weight:700}
.mgl{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:6px}
.mgl li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mgl li .nm{font-weight:600}
.mgl li .bt{display:flex;flex-wrap:wrap;gap:4px}
.mgl h3,.mgh{font-size:13px;margin:10px 0 2px;color:var(--muted)}

/* ---- theme layer ---- */
body{font-size:16px;line-height:1.7}
h1{letter-spacing:.04em}
h2{font-size:17px}
.card{border-radius:14px;padding:18px}
.note{background:var(--accent-soft);border:1px solid var(--hi);border-radius:12px}
.up{color:var(--up)} .down{color:var(--down)}
.err{color:var(--bad)}
button{border-radius:10px}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.primary:hover:not(:disabled){filter:brightness(1.25)}
button.wide{padding:15px 16px;font-size:17px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* the status board */
.stats{background:var(--board);border:none;border-radius:14px;gap:0}
.stat{background:transparent;padding:12px 16px;box-shadow:inset -1px 0 rgba(255,255,255,.1),inset 0 -1px rgba(255,255,255,.1)}
.stats .lab{color:rgba(255,255,255,.7)}
.stats .val{color:var(--on-board)}
.stats .stat:first-child .val{color:var(--hi)}
.stats .val small,.stats .muted{color:rgba(255,255,255,.62)}
.stats .up{color:#FF9AA3} .stats .down{color:#9CC0FF}
.stats .countdown{color:var(--hi)} .stats .countdown.low{color:#FF9AA3}
/* numbers: the UD gothic at weight 700 reads better than a display face at a distance */
.hero-price .num,.big,.clock,.book .px{font-family:var(--font-mono);font-weight:700;letter-spacing:-.01em}
.hero-price .num,.big{color:var(--fg)}
.clocks .cl .clock{font-size:40px}
/* the room code is a numbered paddle: navy on yellow */
.code{display:inline-block;width:max-content;max-width:100%;color:#0F1F3A;background:var(--hi);padding:.06em .24em .1em;border-radius:12px;letter-spacing:.1em;font-family:var(--font-mono);font-weight:700}
.seats li{font-size:14px;padding:4px 12px;background:var(--surface)}
.seats li.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.me{background:var(--hi);color:#0F1F3A}
.side{border:1px solid transparent}
.side.buy{border-color:color-mix(in srgb,var(--buy) 30%,transparent)} .side.sell{border-color:color-mix(in srgb,var(--sell) 30%,transparent)}
.types label:has(input:checked){border-color:var(--fg);background:var(--accent-soft)}
.types em{color:var(--muted)}
.tape span:last-child{border-color:var(--fg);background:var(--hi);color:#0F1F3A}
.scene{border-left-color:var(--hi);border-left-width:4px}
th{color:var(--muted)}
tr.me td{background:var(--accent-soft)}
/* projector: everything a size up */
body.wide{font-size:17px}
body.wide h2{font-size:20px}
body.wide .stats .val{font-size:40px}
body.wide .stats .lab{font-size:13px}
body.wide .seats li{font-size:16px}
body.wide table{font-size:15px}
body.wide .hero-price .num{font-size:84px}

.econ{display:flex;flex-direction:column;gap:6px}
.econrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.econrow>div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:0;min-width:0}
.econrow b{font-size:17px}
.econrow span{font-size:11.5px;color:var(--muted);line-height:1.4}
.econrow .on{background:var(--hi);border-color:var(--hi);color:#0F1F3A}
.econrow .on span{color:#0F1F3A}
body.wide .econrow b{font-size:24px}
.legend i.sw{width:12px;height:12px;border:none;border-radius:3px;vertical-align:-1px}
.futhead{display:flex;flex-direction:column;gap:2px;margin:14px 0 6px;padding-top:10px;border-top:1px dashed var(--line-strong)}
.futhead b{font-size:15px}

.cbook{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.cbook .cb-ask div,.cbook .cb-bid div{display:grid;grid-template-columns:3em 1fr 4em;gap:8px;align-items:baseline;padding:3px 10px;border-radius:8px}
.cbook .cb-ask div{background:var(--sell-soft)} .cbook .cb-bid div{background:var(--buy-soft)}
.cbook .cb-ask span{color:var(--sell);font-weight:700} .cbook .cb-bid span{color:var(--buy);font-weight:700}
.cbook b{font-family:var(--font-mono);font-size:18px;text-align:right} .cbook i{font-style:normal;color:var(--muted);text-align:right}
.cbook .cb-last{text-align:center;padding:6px;font-size:14px}
.cbook .cb-ask,.cbook .cb-bid{display:flex;flex-direction:column;gap:2px}
.cform{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-radius:10px;margin-top:6px}
.cform.buy{background:var(--buy-soft)} .cform.sell{background:var(--sell-soft)}
.cform b{width:2.6em} .cform.buy b{color:var(--buy)} .cform.sell b{color:var(--sell)}
.cform .money{flex:1 1 120px} .cform input.q{width:3.6em;text-align:center}
.cform button{padding:8px 12px}
.book2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.book2>div{display:flex;flex-direction:column} .book2 b{font-family:var(--font-mono);font-size:24px}
@media (max-width:600px){.book2{grid-template-columns:repeat(2,minmax(0,1fr))}}

h3.sec{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:700}
h3.sec:first-child{margin-top:0}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.mcards label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--fg)}
.mcards label.on{border-color:var(--fg);background:var(--accent-soft)}
.mcards input{width:auto;margin-top:5px;accent-color:var(--fg)}
.mcards b{display:block;font-size:16px}
.mcards span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <h1>バブル実験市場</h1>
      <span class="chip" id="modeChip"><span class="dot"></span><span id="modeText">準備中</span></span>
    </div>
    <p class="sub">配当の期待値がはっきり分かる株を、みんなで売り買いする実験です（Smith・Suchanek・Williams 1988 型）。<a href="auction.html" id="crossLink" hidden>オークション実験はこちら</a></p>
  </header>
  <div id="main"></div>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ===== ENGINE START =====
const DIVS=[0,8,28,60], EDIV=24, MAX_PLAYERS=50;
const TYPES=[{shares:4},{shares:3},{shares:2}];
const MAX_PRICE=1000000;
const BOT_STYLES=['fund','trend','noise'];
const BOT_LABEL={fund:'配当重視派',trend:'順張り派',noise:'気分屋'};
function fvAt(T,t){return EDIV*(T-t+1);}
function rngFrom(seed){let a=(seed>>>0)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function newGame(cfg,humans,session,now){
  let econ=null, hid=null, fv1=fvAt(cfg.T,1);
  if(cfg.market==='cycle'){
    const s0=pickIdx(CYC.stat,rand01()), s1=pickIdx(CYC.P[s0],rand01()), mode=cfg.reveal||'end';
    econ={s0:mode==='none'?null:s0,prev:mode==='end'?s0:null,cur:mode==='start'?s1:null,over:false};
    hid={cur:s1,trace:[s1],s0};
    fv1=fvCycle({cfg,econ,history:[],phase:'open'});
  }
  if(cfg.fc&&cfg.fc!=='none') hid={...(hid||{}),fc:{}};
  const seats=humans.map(h=>({id:h.id,name:h.name}));
  for(let i=0;i<cfg.bots;i++){const st=BOT_STYLES[i%3];seats.push({id:'bot-'+(i+1),name:'AI'+(i+1)+'（'+BOT_LABEL[st]+'）',bot:true,style:st});}
  const holdings={},start={};
  seats.forEach((s,i)=>{const ty=TYPES[i%3];const h={cash:Math.round(1080*cfg.cashMult+(3-ty.shares)*fv1),shares:ty.shares};holdings[s.id]={...h};start[s.id]={...h};});
  const game={session,phase:'open',cfg,period:1,...stageStart(cfg,now),seats,ctrl:buildCtrl(seats),holdings,start,fv1,econ,history:[],lastFills:{},seed:Math.floor(Math.random()*1e9)};
  Object.defineProperty(game,'__hid',{value:hid,enumerable:false}); // host-only: never written to the shared state
  return game;
}
function botOrder(seat,g,rng){
  const T=g.cfg.T,t=g.period,fv=cyc(g)?Math.max(1,fvCycle(g)):fvAt(T,t),h=g.holdings[seat.id];
  const H=g.history.filter(x=>x.price!=null);
  const last=H.length?H[H.length-1].price:null, prev=H.length>1?H[H.length-2].price:null;
  const anchor=last!=null?last:fv*(0.5+0.3*rng());
  // b: how much a bot trusts the recent price instead of the fundamental value; fades in the second half

const mktOf=g=>(g&&g.cfg&&g.cfg.mkt)||'call';
const contSec=cfg=>cfg.timer>0?cfg.timer:60;
function stageStart(cfg,now){ // fields for the start of a period's trading
  if((cfg.mkt||'call')==='call') return {stage:null,deadline:cfg.timer?now+cfg.timer*1000:0};
  return {stage:'cont',deadline:now+contSec(cfg)*1000,book:{bids:[],asks:[]},tape:[],bookSeq:0,preStart:null,forcedDone:false};
}
function cdaBook(g){g.book=g.book||{bids:[],asks:[]};g.book.bids=arr(g.book.bids);g.book.asks=arr(g.book.asks);g.tape=arr(g.tape);return g.book;}
function cdaCash(g,id){ // cash usable for buying
  const h=g.holdings[id]; if(g.cfg.risk!=='lock') return Math.max(0,h.cash);
  const P=spotRef(g); return Math.max(0,h.cash-collateralOf(g,h))+1.5*P*Math.max(0,-h.shares);
}
function cdaSellable(g,id){
  const h=g.holdings[id]; let n=Math.max(0,h.shares+shortCap(g,id));
  if(g.cfg.risk==='lock'){const P=spotRef(g), free=Math.max(0,h.cash-collateralOf(g,h)); n=Math.min(n,Math.max(0,h.shares)+Math.floor(free/(0.5*P)));}
  return n;
}
function cdaTrade(g,b,s,p,q,at){const hb=g.holdings[b],hs=g.holdings[s];hb.cash-=p*q;hb.shares+=q;hs.cash+=p*q;hs.shares-=q;g.tape.push({p,q,b,s,at:at||0});}
// Applies one action (by seat id) to the book with price-time priority; trades at the resting order's price.
function cdaApply(g,a){
  const B=cdaBook(g), id=a.id; if(!g.holdings[id]) return false;
  const q0=Math.max(1,Math.min(99,Math.floor(Number(a.q)||1)));
  const px=v=>{v=Math.floor(Number(v));return Number.isFinite(v)&&v>=1&&v<=MAX_PRICE?v:null;};
  if(a.type==='cancel'){if(a.side!=='sell')B.bids=B.bids.filter(o=>o.id!==id);if(a.side!=='buy')B.asks=B.asks.filter(o=>o.id!==id);return true;}
  if(a.type==='bid'||a.type==='buyNow'){
    const p=a.type==='buyNow'?MAX_PRICE:px(a.p); if(p==null) return false;
    B.bids=B.bids.filter(o=>o.id!==id); B.asks.sort((x,y)=>x.p-y.p||x.k-y.k);
    let q=q0;
    while(q>0&&B.asks.length&&B.asks[0].p<=p){
      const o=B.asks[0]; if(o.id===id){B.asks.shift();continue;}
      const can=Math.min(o.q,cdaSellable(g,o.id)); if(can<=0){B.asks.shift();continue;}
      const fill=Math.min(q,can,Math.floor(cdaCash(g,id)/o.p)); if(fill<=0) break;
      cdaTrade(g,id,o.id,o.p,fill,a.at); o.q-=fill; q-=fill; if(o.q<=0) B.asks.shift();
    }
    if(q>0&&a.type==='bid'){const can=Math.min(q,Math.floor(cdaCash(g,id)/p)); if(can>0) B.bids.push({id,p,q:can,k:(g.bookSeq=(g.bookSeq||0)+1)});}
    B.bids.sort((x,y)=>y.p-x.p||x.k-y.k); return true;
  }
  if(a.type==='ask'||a.type==='sellNow'){
    const p=a.type==='sellNow'?1:px(a.p); if(p==null) return false;
    B.asks=B.asks.filter(o=>o.id!==id); B.bids.sort((x,y)=>y.p-x.p||x.k-y.k);
    let q=Math.min(q0,cdaSellable(g,id));
    while(q>0&&B.bids.length&&B.bids[0].p>=p){
      const o=B.bids[0]; if(o.id===id){B.bids.shift();continue;}
      const can=Math.min(o.q,Math.floor(cdaCash(g,o.id)/o.p)); if(can<=0){B.bids.shift();continue;}
      const fill=Math.min(q,can); cdaTrade(g,o.id,id,o.p,fill,a.at); o.q-=fill; q-=fill; if(o.q<=0) B.bids.shift();
    }
    if(q>0&&a.type==='ask') B.asks.push({id,p,q,k:(g.bookSeq=(g.bookSeq||0)+1)});
    B.asks.sort((x,y)=>x.p-y.p||x.k-y.k); return true;
  }
  return false;
}
function contStats(g){const T=arr(g.tape); if(!T.length) return null; const vol=T.reduce((a,t)=>a+t.q,0);
  return {n:T.length,vol,vwap:Math.round(T.reduce((a,t)=>a+t.p*t.q,0)/vol),hi:Math.max(...T.map(t=>t.p)),lo:Math.min(...T.map(t=>t.p)),last:T[T.length-1].p};}
// AI traders during continuous trading: now and then post one side of what they would order in a call market.
function cdaBotActions(g,rnd){
  const out=[], T=arr(g.tape), view=T.length?{...g,history:[...g.history,{t:g.period,price:T[T.length-1].p,volume:0,div:0,fv:0}]}:g;
  for(const s of g.seats){ if(!s.bot||rnd()>0.06) continue;
    const o=botOrder(s,view,rnd); out.push(rnd()<0.5?{id:s.id,type:'bid',p:o.buyP,q:1}:{id:s.id,type:'ask',p:o.sellP,q:1}); }
  return out;
}
// Call orders for the closing auction: a fresh order from the call window, or what is left on the book.
function mixCallOrder(g,id,o){
  if(o&&!o.fcOnly&&g.preStart&&(o.at||0)>=g.preStart) return {...o,id};
  const B=cdaBook(g), b=B.bids.find(x=>x.id===id), a=B.asks.find(x=>x.id===id);
  return {id,buyP:b?b.p:0,buyQ:b?b.q:0,sellP:a?a.p:0,sellQ:a?a.q:0,fc:o&&o.fc};
}

// Firebase drops empty arrays/objects and may turn arrays into objects; put the game back into shape.
function norm(g){
  if(!g) return null;
  g={...g};
  g.cfg={...DEFAULT_CFG,...(g.cfg||{})};
  g.banned=g.banned||{}; g.removed=g.removed||{};
  if(g.phase==='lobby') return g;
  g.seats=arr(g.seats); g.history=arr(g.history).map(r=>({...r,price:r.price??null}));
  if(!g.ctrl) g.ctrl=buildCtrl(g.seats);
  g.holdings=g.holdings||{}; g.start=g.start||{}; g.lastFills=g.lastFills||{};
  return g;
}

const MG={

      g.seats=g.seats.map(x=>x.id===sid?PAGE.asBot({...x,bot:true,uid:null,swapped:true,name:baseName(x.name)+'（AI交代）'},i):x);
      g.ctrl=buildCtrl(g.seats); g.removed={...(g.removed||{}),[gone]:true}; if(ban) g.banned={...(g.banned||{}),[gone]:baseName(s.name)}; return g;});

        g.seats=g.seats.map(x=>x.id===sid?{...x,bot:false,uid,name:p.name,style:null,swapped:null}:x);

    S.admitFor=null;

    if(sid!=='new') await PAGE.afterTakeover(sid,uid);

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function chartHTML(g){
  const W=Math.max(280,Math.round(($('#main')?.clientWidth||600)-34));
  const T=g.cfg.T,H=g.history;
  const h=Math.round(Math.min(document.body.classList.contains('wide')?420:300,Math.max(220,W*0.5)));
  const padL=40,padR=10,padT=12,padB=22,volH=34,gap=16;
  const plotH=h-padT-padB-volH-gap, bw=(W-padL-padR)/T;
  const live=g.phase==='open'&&g.stage?arr(g.tape):[];
  const prices=[...live.map(t=>t.p),...H.filter(x=>x.cont).map(x=>x.cont.hi),...H.filter(x=>x.price!=null).map(x=>x.price),...H.filter(x=>x.fprice!=null).map(x=>x.fprice),...(showDev(g)?H.filter(x=>x.fcAvg!=null).map(x=>x.fcAvg):[])];
  const C=cyc(g), fvRows=C?[...g.history.map(h=>({t:h.t,fv:h.fv})),...(g.phase==='open'?[{t:g.period,fv:fvCycle(g)}]:[])]:[];
  const dev=showDev(g), top=Math.max(dev?(C?Math.max(0,...fvRows.map(r=>r.fv)):fvAt(T,1)):0,...prices,10)*1.06;
  const step=niceStep(top/4), maxY=Math.ceil(top/step)*step;
  const y=v=>padT+plotH*(1-v/maxY), cx=t=>padL+(t-0.5)*bw;
  let s=`<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="各期の約定価格${dev?'と理論価値':''}">`;
  if(g.phase==='open'||g.phase==='result'){s+=`<rect x="${padL+(g.period-1)*bw}" y="${padT}" width="${bw}" height="${h-padT-padB}" fill="var(--accent-soft)" opacity=".7"/>`;}
  for(let v=0;v<=maxY+0.1;v+=step){s+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;}
  if(C) for(const h of g.history){if(h.s==null)continue;const col=h.s===0?'rgba(255,201,40,.28)':h.s===2?'rgba(85,101,124,.20)':'rgba(85,101,124,.06)';s+=`<rect x="${padL+(h.t-1)*bw}" y="${padT}" width="${bw}" height="${plotH}" fill="${col}"/>`;}
  let d='';
  if(C) fvRows.forEach((r,i)=>{const x0=padL+(r.t-1)*bw,x1=x0+bw,yy=y(r.fv);d+=(i===0?`M${x0},${yy}`:`L${x0},${yy}`)+`H${x1}`;});
  else for(let t=1;t<=T;t++){const x0=padL+(t-1)*bw,x1=x0+bw,yy=y(fvAt(T,t));d+=(t===1?`M${x0},${yy}`:`V${yy}`)+`H${x1}`;}
  if(dev) s+=`<path d="${d}" fill="none" stroke="var(--fv)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  let seg=[];const segs=[];
  for(const r of H){if(r.price==null){if(seg.length)segs.push(seg);seg=[];}else seg.push(r);} if(seg.length)segs.push(seg);
  if(dev&&H.some(r=>r.ffv!=null)){let d2='';H.filter(r=>r.ffv!=null).forEach((r,i)=>{const x0=padL+(r.t-1)*bw,x1=x0+bw,yy=y(r.ffv);d2+=(i===0?`M${x0},${yy}`:`L${x0},${yy}`)+`H${x1}`;});s+=`<path d="${d2}" fill="none" stroke="#7C4DDB" stroke-width="1.4" stroke-dasharray="6 4" opacity=".8"/>`;}
  if(dev&&H.some(r=>r.fcAvg!=null)) H.forEach(r=>{if(r.fcAvg!=null){const X=cx(r.t),Y=y(r.fcAvg);s+=`<path d="M${X-5},${Y+4}L${X},${Y-5}L${X+5},${Y+4}Z" fill="none" stroke="#0E7A55" stroke-width="1.8"/>`;}});
  if(H.some(r=>r.fprice!=null)){const fp=H.filter(r=>r.fprice!=null);if(fp.length>1)s+=`<polyline points="${fp.map(r=>cx(r.t)+','+y(r.fprice)).join(' ')}" fill="none" stroke="#7C4DDB" stroke-width="1.8" stroke-dasharray="2 3"/>`;fp.forEach(r=>{s+=`<rect x="${cx(r.t)-3.5}" y="${y(r.fprice)-3.5}" width="7" height="7" fill="#7C4DDB"/>`;});}
  live.forEach((t,i)=>{s+=`<circle cx="${cx(g.period)+((i%5)-2)*Math.min(3,bw/12)}" cy="${y(t.p)}" r="2.6" fill="var(--accent)" opacity=".55"/>`;});
  H.forEach(r=>{if(r.cont&&r.cont.hi>r.cont.lo)s+=`<line x1="${cx(r.t)}" x2="${cx(r.t)}" y1="${y(r.cont.hi)}" y2="${y(r.cont.lo)}" stroke="var(--line-strong)" stroke-width="5" stroke-linecap="round" opacity=".8"/>`;});
  for(const sg of segs){if(sg.length>1)s+=`<polyline points="${sg.map(r=>cx(r.t)+','+y(r.price)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;}
  H.forEach((r,i)=>{if(r.price!=null){const last=i===H.length-1;s+=`<circle cx="${cx(r.t)}" cy="${y(r.price)}" r="${last?5:3.5}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`;}});
  const maxV=Math.max(4,...H.map(r=>r.volume||0)), base=h-padB;
  s+=`<line x1="${padL}" x2="${W-padR}" y1="${base}" y2="${base}" stroke="var(--line-strong)"/>`;
  s+=`<text x="${padL-6}" y="${base-volH/2+4}" text-anchor="end" font-size="10" fill="var(--muted)">出来高</text>`;
  H.forEach(r=>{if(r.volume>0){const bh=Math.max(2,r.volume/maxV*volH);s+=`<rect x="${cx(r.t)-bw*0.28}" y="${base-bh}" width="${bw*0.56}" height="${bh}" fill="var(--line-strong)" rx="1.5"/>`;}});
  const every=bw>=24?1:bw>=13?2:5;
  for(let t=1;t<=T;t++){if(t===1||t%every===0||t===T)s+=`<text x="${cx(t)}" y="${h-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t}</text>`;}
  s+='</svg>';
  return `<div class="spread"><h2>価格の動き</h2><div class="legend"><span><i style="border-color:var(--accent)"></i>約定価格</span>${dev?'<span><i style="border-color:var(--fv);border-top-style:dashed"></i>理論価値</span>':''}${g.history.some(h=>h.cont)?'<span><i class="sw" style="background:var(--line-strong)"></i>ダブルオークションの高値〜安値</span>':''}${g.history.some(h=>h.fprice!=null)?'<span><i class="sw" style="background:#7C4DDB"></i>先物価格</span>':''}${dev&&g.history.some(h=>h.fcAvg!=null)?'<span><i class="sw" style="background:none;border:1.8px solid #0E7A55"></i>予想の平均</span>':''}${dev&&g.history.some(h=>h.ffv!=null)?'<span><i style="border-color:#7C4DDB;border-top-style:dashed"></i>先物の理論価格</span>':''}${cyc(g)&&g.history.some(h=>h.s!=null)?'<span><i class="sw" style="background:rgba(255,201,40,.45)"></i>好況</span><span><i class="sw" style="background:rgba(85,101,124,.3)"></i>不況</span>':''}</div></div><div class="chart">${s}</div>${dev?'<p class="small muted">点線より上で取引されているときは、配当で取り戻せる以上の値段がついている状態です。</p>':''}`;
}

  const f=g.lastFills[id], h=g.holdings[id];
  let head;
  if(r.price==null) head=`<p><strong>取引は成立しませんでした。</strong>買いたい値段と売りたい値段が合いませんでした。</p>`;
  else {const d=(r.price-r.fv)/r.fv;head=`<div class="hero-price"><span class="num">${yen(r.price)}</span><span class="unit">${mktOf(g)!=='call'?(mktOf(g)==='mix'?`円（終値）・この期 ${r.volume}株が取引`:`円（平均）・この期 ${r.volume}株が取引`):`円で ${r.volume}株が取引`}</span></div>${showDev(g)?`<p class="dev ${d>=0?'up':'down'}">理論価値 ${r.fv}円 に対して ${signPct(d)}</p>`:''}`;}
  let mine='';
  if(h){
    const parts=[];
    const myT=arr(g.tape).filter(t=>t.b===id||t.s===id);
    if(myT.length){const bq=myT.filter(t=>t.b===id).reduce((a,t)=>a+t.q,0), bc=myT.filter(t=>t.b===id).reduce((a,t)=>a+t.q*t.p,0), sq=myT.filter(t=>t.s===id).reduce((a,t)=>a+t.q,0), sc=myT.filter(t=>t.s===id).reduce((a,t)=>a+t.q*t.p,0);
      if(bq) parts.push(`ダブルオークションで ${bq}株を買いました（−${yen(bc)}円）`); if(sq) parts.push(`ダブルオークションで ${sq}株を売りました（＋${yen(sc)}円）`);}
    const callPx=mktOf(g)==='mix'?r.callP:r.price;
    if(f&&f.b) parts.push(`${mktOf(g)==='mix'?'一斉取引で ':''}${f.b}株を買いました（−${yen(f.b*callPx)}円）`);
    if(f&&f.s) parts.push(`${mktOf(g)==='mix'?'一斉取引で ':''}${f.s}株を売りました（＋${yen(f.s*callPx)}円）`);
    if(!parts.length) parts.push('あなたの売買は成立しませんでした');
    const ff=(g.lastFFills||{})[id];
    if(ff&&ff.b) parts.push(`先物を ${ff.b}枚 買いました（${yen(r.fprice)}円）`);
    if(ff&&ff.s) parts.push(`先物を ${ff.s}枚 売りました（${yen(r.fprice)}円）`);
    if(g.lastF&&g.lastF[id]) parts.push(`先物の精算 ${g.lastF[id]>=0?'＋':'−'}${yen(Math.abs(g.lastF[id]))}円`);
    if(g.wasForced&&g.wasForced[id]) parts.push('<span class="up">証拠金不足のため、空売り・先物を強制決済しました</span>');
    if(g.lastBonus&&g.lastBonus[id]!=null){const mine=g.cfg.fc==='next'?store.get('fc-'+g.session+'-'+(r.t-1)):null; const b=g.lastBonus[id];
      parts.push(b?`予想ボーナス ＋${yen(b)}円${mine?`（予想 ${yen(Number(mine))}円 → 実際 ${yen(r.price)}円）`:''}`:`予想ボーナスなし${mine&&r.price!=null?`（予想 ${yen(Number(mine))}円 → 実際 ${yen(r.price)}円）`:''}`);}
    if(g.lastInt&&g.lastInt[id]) parts.push(`利子 ＋${yen(g.lastInt[id])}円`);
    const dv=r.div*h.shares; parts.push(h.shares<0?`配当の支払い ${r.div}円 × ${-h.shares}株（空売り） ＝ −${yen(-dv)}円`:`配当 ${r.div}円 × ${h.shares}株 ＝ ＋${yen(dv)}円`);
    if(g.forced&&g.forced[id]) parts.push('<span class="up">証拠金が足りません。次の期に空売り・先物を強制決済します</span>');
    mine=`<ul class="small" style="margin:0;padding-left:1.2em">${parts.map(p=>`<li>${p}</li>`).join('')}</ul>${mineHTML(g,id)}`;
  }

}

    short:($('#cfgShort')?.value==='init'?'init':Number($('#cfgShort')?.value||0)),fut:$('#cfgFut')?.value||'none',risk:$('#cfgRisk')?.value||'call',fc:$('#cfgFc')?.value||'none',fcBonus:Number($('#cfgFcBonus')?.value??20),lateEnd:Number($('#cfgLate')?.value||0.3),mkt:document.querySelector('input[name=cfgMkt]:checked')?.value||'call',preSec:Number($('#cfgPre')?.value||15)};

function qrSVG(text){
  if(typeof qrcode!=='function') return '';
  try{
    const q=qrcode(0,'M'); q.addData(text); q.make();
    const n=q.getModuleCount(); let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+2} ${r+2}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="参加用のQRコード"><rect width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){return '';}
}

function readTicket(h){
  const val=k=>{const s=$('#'+k).value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();return s===''?null:Number(s);};
  const buyP=val('buyP'),buyQ=val('buyQ')??0,sellP=val('sellP'),sellQ=val('sellQ')??0;
  const isInt=x=>Number.isInteger(x)&&x>=0;
  if(![buyQ,sellQ].every(isInt)) return {err:'株数は0以上の整数で入れてください。'};
  if(buyQ>0&&!(Number.isInteger(buyP)&&buyP>=1)) return {err:'買いの値段を入れてください（買わないなら株数を0に）。'};
  if(sellQ>0&&!(Number.isInteger(sellP)&&sellP>=1)) return {err:'売りの値段を入れてください（売らないなら株数を0に）。'};
  if((buyQ>0&&buyP>MAX_PRICE)||(sellQ>0&&sellP>MAX_PRICE)) return {err:'注文価格は1,000,000円以下で入れてください。'};
  if(buyQ>0&&buyP*buyQ>h.cash) return {err:`現金が足りません。${buyP}円なら最大 ${Math.floor(h.cash/buyP)} 株です。`};
  const g0=G(), cap=g0?shortCap(g0,myId()):0;
  if(sellQ>Math.max(0,h.shares+cap)) return {err:cap?`売れるのは ${Math.max(0,h.shares+cap)} 株までです（空売りを含む）。`:`持っている株は ${h.shares} 株です。`};
  if(buyQ>0&&sellQ>0&&sellP<=buyP) return {err:'売りの値段は、買いの値段より高くしてください。'};
  const o={buyP:buyQ>0?buyP:0,buyQ,sellP:sellQ>0?sellP:0,sellQ};
  if($('#fcIn')){const f=val('fcIn'); if(f!=null){if(!(Number.isInteger(f)&&f>=1&&f<=MAX_PRICE)) return {err:'予想は1〜1,000,000円の整数で入れてください（入れなくてもかまいません）。'}; o.fc=f;}}
  if($('#fBuyQ')){
    const fBuyP=val('fBuyP'),fBuyQ=val('fBuyQ')??0,fSellP=val('fSellP'),fSellQ=val('fSellQ')??0, pos=h.fpos||0;
    if(![fBuyQ,fSellQ].every(isInt)) return {err:'先物の枚数は0以上の整数で入れてください。'};
    if(fBuyQ>0&&!(Number.isInteger(fBuyP)&&fBuyP>=1)) return {err:'先物の買いの値段を入れてください（買わないなら枚数を0に）。'};
    if(fSellQ>0&&!(Number.isInteger(fSellP)&&fSellP>=1)) return {err:'先物の売りの値段を入れてください（売らないなら枚数を0に）。'};
    if((fBuyQ>0&&fBuyP>MAX_PRICE)||(fSellQ>0&&fSellP>MAX_PRICE)) return {err:'先物の値段は1,000,000円以下で入れてください。'};
    if(pos+fBuyQ>FLIM||pos-fSellQ<-FLIM) return {err:`先物は買い・売りとも ${FLIM} 枚までです（いま ${pos>0?'買い '+pos:pos<0?'売り '+(-pos):'0'} 枚）。`};
    if(fBuyQ>0&&fSellQ>0&&fSellP<=fBuyP) return {err:'先物の売りの値段は、買いの値段より高くしてください。'};
    Object.assign(o,{fBuyP:fBuyQ>0?fBuyP:0,fBuyQ,fSellP:fSellQ>0?fSellP:0,fSellQ});
  }
  return {o};
}

// Atomically read accepted orders and commit state + log. A competing host tab
// can settle the same session/period only once; transaction retries reuse the draw.
function settleRoom(room,expected,dividend,u){
  if(!room) return null; // Firebase may call a transaction with an empty cache.
  const g=norm(room.state);
  if(!g||g.phase!=='open'||g.session!==expected.session||g.period!==expected.period) return;
  let orders=Object.entries(room.orders||{}).filter(([,o])=>o&&o.session===g.session&&o.period===g.period).map(([u,o])=>({...o,id:(g.ctrl||{})[u]})).filter(o=>o.id);
  if(mktOf(g)==='mix'){const by={};orders.forEach(o=>by[o.id]=o);orders=g.seats.filter(s=>!s.bot).map(s=>mixCallOrder(g,s.id,by[s.id]));}
  if(mktOf(g)==='cont') orders=orders.map(o=>({id:o.id,fc:o.fc}));
  const {game,record,hid}=settle(g,orders,dividend,{hid:room.hidden,u}); game.rev=Math.max(game.rev||0,(S.game?.rev||0)+1);
  const log={...(room.log||{})};
  log[g.session]={...(log[g.session]||{}),['p'+record.t]:record};
  return clean({...room,state:game,log,hidden:hid||room.hidden});
}

function diffPaths(a,b,path,out,depth){
  if(JSON.stringify(a)===JSON.stringify(b)) return out;
  const obj=v=>v&&typeof v==='object';
  if(obj(a)&&obj(b)&&depth<6){for(const k of new Set([...Object.keys(a),...Object.keys(b)])) diffPaths(a[k],b[k],path+'/'+k,out,depth+1);}
  else out[path]=b===undefined?null:b;
  return out;
}
async function commitState(next){
  next=clean({...next,rev:(S.game?.rev||0)+1}); S.game=next; render();
  const prev=S.written, patch={};
  if(prev&&prev.session===next.session){for(const k of new Set([...Object.keys(prev),...Object.keys(next)])) diffPaths(prev[k],next[k],k,patch,1);}
  try{ if(prev&&prev.session===next.session){ if(Object.keys(patch).length) await F.db.ref(`rooms/${S.code}/state`).update(patch);} else await F.db.ref(`rooms/${S.code}/state`).set(next);
    S.written=next; return true;}catch(e){S.written=null; dbErr(e); return false;}
}
// Continuous trading is run by the host (and by the page itself in solo practice): queued actions, AI orders, the clock.
S.seenQ=new Set();
async function cdaHostTick(){
  const solo=S.mode==='solo', g=solo?S.solo:S.game;
  if(!g||g.phase!=='open'||!g.stage||(!solo&&(S.mode!=='host'||S.busy||!S.connected))||S.cdaBusy) return;
  const now=solo?Date.now():serverNow();
  if(g.stage==='cont'&&now>=g.deadline){
    if(mktOf(g)==='mix'){const next={...clean(g),stage:'pre',preStart:now,deadline:now+preSec(g.cfg)*1000}; if(solo){S.solo=next;render();} else {S.cdaBusy=true; await commitState(next); S.cdaBusy=false;} return;}
    if(solo) soloClose(); else hostClose(); return;
  }
  if(g.stage==='pre'){ if(now>=g.deadline){ if(solo) soloClose(); else hostClose(); } return; }
  const next=clean(g); let ch=false;
  if(!next.forcedDone&&next.forced&&Object.keys(next.forced).length){ for(const id in next.forced){const h=next.holdings[id]; if(h&&h.shares<0) ch=cdaApply(next,{id,type:'buyNow',q:-h.shares,at:now})||ch;} next.forcedDone=true; ch=true; }
  const keys=[];
  if(!solo){
    const items=Object.entries(S.queue||{}).filter(([k])=>!S.seenQ.has(k)).map(([k,v])=>({k,...v})).sort((a,b)=>(a.at||0)-(b.at||0)||(a.k<b.k?-1:1));
    for(const a of items){S.seenQ.add(a.k); keys.push(a.k); const sid=seatIdOf(next,a.uid); if(!sid||a.session!==next.session||a.period!==next.period) continue; ch=cdaApply(next,{...a,id:sid})||ch;}
  }
  for(const a of cdaBotActions(next,Math.random)) ch=cdaApply(next,{...a,at:now})||ch;
  if(ch){ if(solo){S.solo=next;render();} else {S.cdaBusy=true; await commitState(next); S.cdaBusy=false;} }
  if(keys.length) try{await F.db.ref(`rooms/${S.code}/queue`).update(Object.fromEntries(keys.map(k=>[k,null])));}catch(e){}
}

async function hostClose(){

    const g=S.game; if(S.busy||!g||g.phase!=='lobby') return;
    const cfg=readSettings(), humans=lobbyPlayers(g).slice(0,MAX_PLAYERS).map(p=>({id:p.id,name:p.name}));
    if(!humans.length&&!cfg.bots){S.msg='参加者がいません。参加者を待つか、AIトレーダーを1人以上にしてください。';render();return;}
    S.busy=true; render(); const ng=newGame(cfg,humans,g.session,serverNow());
    if(ng.__hid) await W(`rooms/${S.code}/hidden`,ng.__hid);
    await W(`rooms/${S.code}/state`,{...ng,banned:g.banned}); S.busy=false; render();
  },
  closePeriod(){hostClose();},
  async nextPeriod(){const g=S.game;if(S.busy||!g||g.phase!=='result')return;S.busy=true;render();
    const exp={session:g.session,period:g.period};
    try{const ref=F.db.ref(`rooms/${S.code}`); await ref.get();
      await ref.transaction(room=>{if(!room)return room; const cur=norm(room.state); if(!cur||cur.phase!=='result'||cur.session!==exp.session||cur.period!==exp.period) return;
        const {game,hid}=advance(cur,serverNow(),room.hidden); game.rev=Math.max((cur.rev||0),(S.game?.rev||0))+1; return clean({...room,state:game,hidden:hid||room.hidden});},undefined,false);
    }catch(e){dbErr(e);} S.busy=false;render();},
  async newRound(){S.showAna=false;await W(`rooms/${S.code}/state`,{...lobbyState(S.game&&S.game.cfg),banned:S.game&&S.game.banned});},
  endAsk(){S.confirmEnd=true;render();},
  endCancel(){S.confirmEnd=false;render();},
  async endConfirm(){S.confirmEnd=false;await W(`rooms/${S.code}/state`,{...lobbyState(S.game&&S.game.cfg),banned:S.game&&S.game.banned});},
  csvTape(){
    const g=G(); const idx={}; g.seats.forEach((s,i)=>idx[s.id]=i+1); const nm=id=>(g.seats.find(s=>s.id===id)||{}).name||'';
    const rows=[['期','順番','価格','株数','買い手の席','買い手','売り手の席','売り手']];
    for(const r of currentRecords()) arr(r.tape).forEach((t,i)=>rows.push([r.t,i+1,t.p,t.q,idx[t.b]??'',nm(t.b),idx[t.s]??'',nm(t.s)]));
    download(`ダブルオークションの取引_${S.code||'練習'}_${stamp()}.csv`,rows);
  },
  csvPrices(){
    const g=G(), C=cyc(g); const rows=[['期',...(C?['景気','金利(%)']:[]),'理論価値','約定価格','理論値との差(%)','出来高','配当','注文した人数','先物価格','先物の取引量','先物の理論価格','この期の株価の予想の平均','ダブルオークションの取引回数','ダブルオークションの平均価格','ダブルオークションの高値','ダブルオークションの安値','一斉取引の終値']];
    g.history.forEach(r=>rows.push([r.t,...(C?[r.s!=null?CYC.name[r.s]:'',r.r!=null?Math.round(r.r*1000)/10:'']:[]),r.fv,r.price??'',r.price!=null?Math.round((r.price-r.fv)/r.fv*1000)/10:'',r.volume,r.div,r.n??'',r.fprice??'',r.fvol??'',r.ffv??'',r.fcAvg??'',r.cont?.n??'',r.cont?.vwap??'',r.cont?.hi??'',r.cont?.lo??'',r.callP??'']));
    download(`価格の記録_${S.code||'練習'}_${stamp()}.csv`,rows);
  },
  csvOrders(){
    const g=G(); const idx={}; g.seats.forEach((s,i)=>idx[s.id]=i+1);
    const rows=[['期','席番号','名前','種類','買い値','買い株数','売り値','売り株数','買えた株数','売れた株数','約定価格','配当','期末の現金','期末の株数','先物の買い値','先物の買い枚数','先物の売り値','先物の売り枚数','先物の買えた枚数','先物の売れた枚数','先物価格','期末の先物','出した予想','予想ボーナス']];
    for(const r of currentRecords()){
      const orders={}; arr(r.orders).forEach(o=>orders[o.id]=o);
      for(const s of g.seats){
        const o=orders[s.id]||{}, f=(r.fills||{})[s.id]||{}, a=(r.after||{})[s.id]||{};
        const ff=(r.ffills||{})[s.id]||{};
        rows.push([r.t,idx[s.id],s.name,s.bot?'AI':'人',o.buyQ?o.buyP:'',o.buyQ||0,o.sellQ?o.sellP:'',o.sellQ||0,f.b||0,f.s||0,r.price??'',r.div,a.cash??'',a.shares??'',o.fBuyQ?o.fBuyP:'',o.fBuyQ||0,o.fSellQ?o.fSellP:'',o.fSellQ||0,ff.b||0,ff.s||0,r.fprice??'',a.fpos??0,(r.fc||{})[s.id]??'',(r.bonus||{})[s.id]??'']);
      }
    }
    download(`注文の記録_${S.code||'練習'}_${stamp()}.csv`,rows);
  }
};
document.addEventListener('change',e=>{
  if(!e.target.closest||!e.target.closest('#setupBox')) return;
  const c=readSettings();
  if(S.mode==='solo'){S.soloCfg={...S.soloCfg,...c};S.soloSetupOpen=true;} else if(S.game){S.bdraft={session:S.game.session,cfg:{...S.game.cfg,...c}}; if(S.mode==='host'&&S.game.phase==='lobby') W(`rooms/${S.code}/state/cfg`,S.bdraft.cfg);}
  render();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();ACT[b.dataset.act]?.(b);});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='ticket') submitOrder();
  else if(e.target.id==='cdaBidForm'||e.target.id==='cdaAskForm'){const buy=e.target.id==='cdaBidForm'; const p=Number(($(buy?'#cbP':'#caP').value||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))), q=Number($(buy?'#cbQ':'#caQ').value||1);
    if(!(Number.isInteger(p)&&p>=1&&p<=MAX_PRICE)){$('#cdaErr').textContent='値段を1〜1,000,000円の整数で入れてください。';return;}
    if(!(Number.isInteger(q)&&q>=1&&q<=99)){$('#cdaErr').textContent='株数は1〜99で入れてください。';return;}
    $('#cdaErr').textContent=''; cdaAct({type:buy?'bid':'ask',p,q});}
  else if(e.target.id==='cdaFcForm'){const f=Number($('#cfcIn').value); const g=S.game; if(!(Number.isInteger(f)&&f>=1&&f<=MAX_PRICE)){$('#cfcState').textContent='予想は1〜1,000,000円の整数で。';return;}
    store.set('fc-'+g.session+'-'+g.period,String(f));
    W(`rooms/${S.code}/orders/${S.uid}`,{buyP:0,buyQ:0,sellP:0,sellQ:0,fc:f,fcOnly:true,session:g.session,period:g.period,at:firebase.database.ServerValue.TIMESTAMP}).then(ok=>{$('#cfcState').textContent=ok?`予想 ${yen(f)}円 を出しました（出し直せます）。`:'';});}
  else if(e.target.id==='joinForm') join();
  else if(e.target.id==='codeForm'){const c=($('#codeIn').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==5){$('#codeErr').textContent='部屋コードは5文字です。';return;}location.replace('?r='+c);}
  else if(e.target.id==='hostForm'){(async()=>{const p=($('#hostPass').value||'').trim();if(!p){$('#hostErr').textContent='パスワードを入れてください。';return;}
    if(await verifyHost(p)){store.set(HOST_KEY,p);S.hostOK=true;S.hostLogin=false;render();}else $('#hostErr').textContent='パスワードが違います。Firebase に登録したパスワード（config の hostKey）を確認してください。';})();}
});
document.addEventListener('input',e=>{if(e.target.closest('#ticket')){updateHints();$('#ticketErr').textContent='';}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const c=[...$('#main').children].find(x=>x.dataset.id==='chart');if(c)c.dataset.key='';render();},150);});

/* ---------- boot ---------- */
function startSolo(){S.solo=newGame(S.soloCfg,[{id:'you',name:'あなた'}],'solo-'+Date.now().toString(36),Date.now());S.soloHid=S.solo.__hid;S.soloOrder=null;S.soloLog={};S.mode='solo';render();window.scrollTo({top:0});}
async function routeAfterAuth(){
  const q=new URLSearchParams(location.search);
  const code=(q.get('host')||q.get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length===5){enterRoom(code);return;}
  const saved=store.get(HOST_KEY);
  if(saved){S.hostOK=await verifyHost(saved); if(!S.hostOK){try{localStorage.removeItem(HOST_KEY);}catch(e){}}}
  S.mode='home';render();
}
// Says exactly what is wrong with config.js / the Firebase scripts, so the fix is obvious.
function setupProblem(cfg){
  if(cfg==null||typeof cfg!=='object') return 'config.js が読み込めていないか、中に「window.FIREBASE_CONFIG = { … };」がありません。Firebase の画面からコピーした「const firebaseConfig = { … }」をそのまま貼った場合は、「const firebaseConfig」を「window.FIREBASE_CONFIG」に書き換えてください。';
  if(!cfg.apiKey||/ここに/.test(cfg.apiKey)) return 'config.js がまだ初期状態です（apiKey が入っていません）。ファイルを更新したときに、設定済みの config.js を上書きしていないか確認してください。';
  if(!cfg.databaseURL) return 'config.js に databaseURL がありません。Realtime Database の「データ」タブの上に出ているアドレスを書き足してください（README の手順4）。';
  if(typeof firebase==='undefined') return 'Firebase のプログラムを読み込めませんでした。ネットワーク（学校のフィルタなど）を確認して、読み込み直してください。';
  return '';
}
function boot(){
  const cfg=window.FIREBASE_CONFIG;
  S.setupMsg=setupProblem(cfg); const configured=!!(cfg&&cfg.apiKey&&cfg.databaseURL&&!/ここに/.test(cfg.apiKey));
  S.configured=!!configured;
  if(!configured||typeof firebase==='undefined'){
    S.online=false;
    const q=new URLSearchParams(location.search);
    if(q.get('r')||q.get('host')) S.msg='この部屋に入れません。'+S.setupMsg;
    S.mode='home'; render(); return;
  }
  try{
    F.app=firebase.initializeApp(cfg); F.auth=firebase.auth(); F.db=firebase.database();
  }catch(e){S.online=false;S.msg='Firebase の設定（config.js）を読み込めませんでした。databaseURL が入っているか確認してください。';S.mode='home';render();return;}
  S.online=true; S.hostOK=false; render();
  F.db.ref('.info/serverTimeOffset').on('value',s=>{S.offset=s.val()||0;});
  F.db.ref('.info/connected').on('value',s=>{S.connected=!!s.val();render();});
  F.auth.onAuthStateChanged(u=>{
    if(u){ if(!S.uid){S.uid=u.uid;routeAfterAuth();} }
    else F.auth.signInAnonymously().catch(e=>{
      const c=String(e&&e.code||'');
      S.msg=/operation-not-allowed|admin-restricted/.test(c)?'Firebase の「匿名ログイン」が有効になっていません。進行役は README の手順2を確認してください。':'ログインに失敗しました。ネットワークを確認して、読み込み直してください。';
      S.online=false; S.mode='home'; render();
    });
  });
}
boot();
